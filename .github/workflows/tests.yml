name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # REAPER 7 runs its scripts with Lua 5.4.
          - lua: "5.4.9"
            sha256: "2335b6c582a52654f94612bf10d2f4672805d05329aa6568b1d8cd9e5c6fb8e6"
          # Lua used for development.
          - lua: "5.5.1"
            sha256: "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce"

    steps:
      - uses: actions/checkout@v5

      - name: Build Lua ${{ matrix.lua }}
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO "https://www.lua.org/ftp/lua-${{ matrix.lua }}.tar.gz"
          echo "${{ matrix.sha256 }}  lua-${{ matrix.lua }}.tar.gz" | sha256sum -c -
          tar xzf "lua-${{ matrix.lua }}.tar.gz"
          make -s -C "lua-${{ matrix.lua }}" linux
          echo "$PWD/lua-${{ matrix.lua }}/src" >> "$GITHUB_PATH"

      - name: Check the syntax of every script
        run: |
          lua -v
          git ls-files -z '*.lua' | xargs -0 -n 1 luac -p

      - name: Run the tests
        run: lua Tests/run.lua
